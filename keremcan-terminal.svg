<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none">
  <defs>
    <linearGradient id="bg" x1="56" y1="24" x2="1210" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111126"/>
      <stop offset=".55" stop-color="#17152F"/>
      <stop offset="1" stop-color="#101A25"/>
    </linearGradient>
    <linearGradient id="panel" x1="84" y1="84" x2="847" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A31"/>
      <stop offset="1" stop-color="#111320"/>
    </linearGradient>
    <linearGradient id="violet" x1="820" y1="123" x2="1118" y2="359" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BB9CFF"/>
      <stop offset="1" stop-color="#7657F6"/>
    </linearGradient>
    <linearGradient id="mint" x1="890" y1="139" x2="1127" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7FFE1"/>
      <stop offset="1" stop-color="#44D6A2"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="matrix(0 100 -100 0 1014 195)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4D6FF"/>
      <stop offset=".45" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#7455E9"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B7A6FF" fill-opacity=".19"/>
    </pattern>
    <filter id="shadow" x="780" y="92" width="400" height="330" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="18"/>
      <feColorMatrix values="0 0 0 0 0.02 0 0 0 0 0.02 0 0 0 0 0.08 0 0 0 .48 0"/>
      <feBlend in2="SourceGraphic" result="shadow"/>
      <feBlend in="SourceGraphic" in2="shadow"/>
    </filter>
    <clipPath id="rounded"><rect x="1" y="1" width="1278" height="458" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect x="806" y="0" width="474" height="460" fill="url(#dots)" opacity=".7"/>
    <circle cx="1160" cy="56" r="170" fill="#7561E8" fill-opacity=".10"/>
    <circle cx="842" cy="433" r="160" fill="#47D4A2" fill-opacity=".07"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="65" fill="#AFA4D9" font-size="15" letter-spacing="3">KEREMCAN ATAŞ</text>
      <rect x="240" y="49" width="7" height="7" rx="3.5" fill="#6EE7B7"/>
      <text x="260" y="65" fill="#7E829A" font-size="13" letter-spacing="1.5">BACKEND DEVELOPER · KOCAELİ, TR</text>
    </g>

    <rect x="68" y="94" width="740" height="292" rx="20" fill="url(#panel)" stroke="#3B3B59" stroke-width="1.5"/>
    <path d="M68 145H808" stroke="#33344D"/>
    <circle cx="96" cy="120" r="6" fill="#FF6F91"/>
    <circle cx="118" cy="120" r="6" fill="#FFD166"/>
    <circle cx="140" cy="120" r="6" fill="#6EE7B7"/>
    <text x="438" y="125" fill="#797D94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">keremcan@dev-machine ~</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="105" y="194" fill="#8F83E8" font-size="18">&gt;</text>
      <text x="130" y="194" fill="#D6D4E7" font-size="18">whoami</text>
      <text x="105" y="236" fill="#6EE7B7" font-size="21" font-weight="700">Keremcan</text>
      <text x="105" y="274" fill="#B2B4C8" font-size="15">Student by day, builder whenever there’s a good idea.</text>
      <text x="105" y="320" fill="#8F83E8" font-size="18">&gt;</text>
      <text x="130" y="320" fill="#D6D4E7" font-size="18">dotnet run --project next-big-idea</text>
      <text x="105" y="356" fill="#6EE7B7" font-size="16">Hadi kodlamaya başlayalım!</text>
      <rect x="385" y="339" width="10" height="21" rx="2" fill="#B7A6FF">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g filter="url(#shadow)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="5s" repeatCount="indefinite"/>
        <path d="M1009 123 1110 181 1009 239 908 181 1009 123Z" fill="url(#mint)" stroke="#D1FFEB" stroke-opacity=".55"/>
        <path d="M908 181 1009 239V356L908 297V181Z" fill="#348D7C" stroke="#9BFFE0" stroke-opacity=".45"/>
        <path d="M1009 239 1110 181V298L1009 356V239Z" fill="#275D67" stroke="#9BFFE0" stroke-opacity=".35"/>
        <path d="m1009 154 49 28-49 28-49-28 49-28Z" fill="#EDFFF6" fill-opacity=".65"/>
        <path d="m936 193 57 33v83l-57-33v-83Z" fill="#55C6A2" fill-opacity=".55"/>
        <path d="m1025 228 57-33v82l-57 33v-82Z" fill="#163F4A" fill-opacity=".52"/>
        <path d="M1009 106 1110 164 1009 222 908 164 1009 106Z" stroke="#C1FFEA" stroke-opacity=".28" stroke-width="2"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="1124" cy="104" r="28" fill="url(#orb)"/>
      <path d="M1114 104h20M1124 94v20" stroke="#F6F1FF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="m874 255 10 10-10 10-10-10 10-10Z" fill="#FFD166">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="m1169 357 7 7-7 7-7-7 7-7Z" fill="#6EE7B7">
      <animate attributeName="opacity" values="1;.4;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <text x="1054" y="406" fill="#A9A4C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" letter-spacing="2">BUILD · LEARN · REPEAT</text>
  </g>
  <rect x="1" y="1" width="1278" height="458" rx="30" stroke="#5C557F" stroke-opacity=".65" stroke-width="2"/>
</svg>
